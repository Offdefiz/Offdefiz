<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Partelís</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/partelis.css"><style>body{background:#f7f5fb;color:#261b39;font-family:system-ui}main{max-width:1150px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button,.link{border:1px solid #d9d2e5;border-radius:12px;background:white;padding:11px 16px;cursor:pointer;color:#30145f}button.active{background:#30145f;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.panel{background:white;border:1px solid #e8e1f0;border-radius:18px;padding:20px;margin:16px 0;overflow:auto}.metric{font-size:28px;font-weight:700}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #eee}input,select,textarea{border:1px solid #d9d2e5;border-radius:10px;padding:10px;max-width:100%}form{display:flex;gap:8px;flex-wrap:wrap}small{color:#746a80}a{color:#5c30a4}#notice{min-height:20px}</style></head><body><main><header><div><img src="/brand-horizontal.svg" alt="Partelís" width="160"><h1>Centro de comando</h1><p>Operação SaaS e relacionamento com escritórios</p></div><a class="link" href="/">Voltar ao aplicativo</a></header><p id="notice" role="status"></p><nav><button data-tab="overview" class="active">Visão geral</button><button data-tab="tenants">Escritórios</button><button data-tab="crm">CRM Partelís</button><button data-tab="feedback">Feedback beta</button></nav><section id="content" aria-live="polite">Carregando…</section></main><script src="/admin.js"></script></body></html>
