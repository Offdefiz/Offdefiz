name: Caixa Jurídico - testes
on:
  push:
    branches:
      - caixa-juridico
      - caixa-juridico-melhorias-**
  pull_request:
    branches:
      - caixa-juridico
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
