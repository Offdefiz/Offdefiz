name: Partelís · publicação automática em produção

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: partelis-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixar revisão e verificar pacote
        id: revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          bash -n ops/vps/deploy-commercial.sh
          npm install --ignore-scripts
          npm run build
          npm test
          npm run test:deploy
      - name: Integração PostgreSQL, escritórios e permissões
        env:
          PGDATABASE: partelis_verify_ci
        run: |
          set -euo pipefail
          sudo systemctl start postgresql
          sudo -u postgres createuser --createdb "$(id -un)"
          createdb "$PGDATABASE"
          psql -v ON_ERROR_STOP=1 -f ops/native/schema.sql
          psql -v ON_ERROR_STOP=1 -f ops/native/migrations/2026-11-04-sales-onboarding.sql
          psql -v ON_ERROR_STOP=1 -f ops/native/migrations/2026-11-10-multiarea-foundation.sql
          psql -v ON_ERROR_STOP=1 -f ops/native/migrations/2026-11-10-ops-metrics.sql
          psql -v ON_ERROR_STOP=1 -f ops/native/migrations/2026-11-10-cnj-inbox.sql
          psql -v ON_ERROR_STOP=1 -f ops/native/migrations/2026-11-15-pagbank.sql
          psql -v ON_ERROR_STOP=1 -f ops/native/migrations/2026-11-16-commercial-reconciliation.sql
          node ops/native/verify.cjs
          node ops/native/commercial.verify.cjs
          node ops/native/legal.verify.cjs
          node ops/native/ops.verify.cjs
          node ops/native/payments.verify.cjs
          node ops/native/reconciliation.verify.cjs

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    steps:
      - name: Confirmar revisão publicada pela sincronização da VPS
        env:
          EXPECTED_REVISION: ${{ needs.verify.outputs.revision }}
        run: |
          set -euo pipefail
          # The existing VPS systemd timer pulls main every five minutes.
          # Its deploy routine runs tests, encrypted backup and rollback locally.
          # Do not require a second SSH access path from GitHub.
          for attempt in $(seq 1 44); do
            if curl --fail --silent --show-error --max-time 10 \
              https://partelis.com.br/health -o /tmp/partelis-health.json; then
              if EXPECTED_REVISION="$EXPECTED_REVISION" node -e '
                const fs = require("node:fs");
                const health = JSON.parse(fs.readFileSync("/tmp/partelis-health.json", "utf8"));
                process.exit(health.status === "ok" && health.configured === true &&
                  health.revision === process.env.EXPECTED_REVISION ? 0 : 1);
              '; then
                echo "Revisão $EXPECTED_REVISION confirmada em produção."
                echo "### Publicação confirmada pela VPS" >> "$GITHUB_STEP_SUMMARY"
                echo "Revisão: $EXPECTED_REVISION" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "Aguardando a sincronização da VPS (tentativa $attempt/44)."
            sleep 15
          done
          echo "::error::A VPS não confirmou a revisão esperada. Verifique partelis-sync-main.service."
          exit 1
