name: Partelís · motion no Chromium
on:
  pull_request:
    branches: [main]
    paths:
      - 'landing.html'
      - 'landing.css'
      - 'landing-motion.css'
      - 'landing-motion.js'
      - 'landing-motion.browser.test.cjs'
      - 'product-showcase.css'
      - 'telas/*.webp'
      - '.github/workflows/landing-motion-browser.yml'
  push:
    branches: [main]
    paths:
      - 'landing.html'
      - 'landing.css'
      - 'landing-motion.css'
      - 'landing-motion.js'
      - 'landing-motion.browser.test.cjs'
      - 'product-showcase.css'
      - 'telas/*.webp'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (CI only)
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test responsive motion, showcase and contrast
        run: node --test landing-motion.browser.test.cjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partelis-motion-screenshots
          path: motion-*.png
          if-no-files-found: ignore
