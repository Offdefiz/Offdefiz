<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp → Partelís</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/partelis.css"><body><main style="max-width:600px;margin:40px auto;padding:24px"><h1>Criar card do WhatsApp</h1><p>Confira o telefone e o escritório antes de salvar. Um cliente pode ter vários cards.</p><p id="workspace"></p><p id="status" role="status"></p><a href="/login" target="_blank" rel="noopener">Entrar no Partelís</a> · <button id="reload" type="button">Atualizar conexão</button><form id="capture"><p><label>Nome <input name="name" required maxlength="150"></label></p><p><label>Telefone com país e DDD <input name="phone" required maxlength="25" placeholder="+55 31 99999-9999"></label></p><p id="match"></p><p><label>Área <input name="area" list="areas" required maxlength="100"></label><datalist id="areas"></datalist></p><p><label>Responsável <select name="owner"></select></label></p><p><label>Próxima ação <input name="next" value="Realizar primeiro atendimento" required maxlength="300"></label></p><p><label>Data do retorno <input name="due" type="date" required></label></p><p><label>Observação selecionada <textarea name="note" maxlength="2000"></textarea></label></p><p><label><input type="checkbox" name="newOpportunity"> Criar outra oportunidade mesmo se houver card aberto</label></p><button id="save" disabled>Criar ou localizar card</button></form><p><a href="/app">Abrir Kanban no Partelís</a></p></main><script src="/domain.js"></script><script src="/whatsapp-capture.js"></script></body></html>
